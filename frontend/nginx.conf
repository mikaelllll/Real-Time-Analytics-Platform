server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /docs { proxy_pass http://api:8000/docs; }
  location /openapi.json { proxy_pass http://api:8000/openapi.json; }
  location /healthz { access_log off; add_header Content-Type text/plain; return 200 'ok'; }
}
