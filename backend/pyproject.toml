[project]
name = "skystream-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "aiokafka==0.15.0",
  "asyncpg==0.32.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic-settings==2.16.2",
  "redis==8.1.0",
  "sqlalchemy==2.1.6",
  "structlog==26.1.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["pip-audit==2.10.1", "pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
